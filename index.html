<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر تطبيقات بلس</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-secondary: #94a3b8;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .search-box {
            width: 100%;
            max-width: 500px;
            margin: 0 auto 30px auto;
            display: block;
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid #334155;
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 16px;
            outline: none;
        }
        .search-box:focus {
            border-color: var(--accent-color);
        }
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .app-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .app-icon {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            object-fit: cover;
            background-color: #334155;
        }
        .app-info {
            flex: 1;
        }
        .app-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .app-desc {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }
        .download-btn {
            background-color: var(--accent-color);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            display: inline-block;
            transition: background 0.2s;
        }
        .download-btn:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

    <header>
        <h1>متجر تطبيقات بلس</h1>
        <p style="color: var(--text-secondary); font-size: 14px;">أفضل التطبيقات المعدلة بلمسة زر</p>
    </header>

    <input type="text" id="searchInput" class="search-box" placeholder="ابحث عن تطبيق...">

    <div id="appsGrid" class="apps-grid">
        <!-- سيتم تعبئة التطبيقات تلقائياً هنا -->
    </div>

    <script>
        let allApps = [];

        async function loadApps() {
            try {
                let response = await fetch('apps.json');
                allApps = await response.json();
                displayApps(allApps);
            } catch (error) {
                console.log('خطأ في تحميل البيانات', error);
                document.getElementById('appsGrid').innerHTML = '<p style="text-align:center; color: red; grid-column: 1/-1;">تأكد من وجود ملف apps.json بجانب ملف الكود.</p>';
            }
        }

        function displayApps(apps) {
            const grid = document.getElementById('appsGrid');
            grid.innerHTML = '';
            
            if(apps.length === 0) {
                grid.innerHTML = '<p style="text-align:center; color: var(--text-secondary); grid-column: 1/-1;">لا توجد تطبيقات مطابقة لبحثك</p>';
                return;
            }

            apps.forEach(app => {
                grid.innerHTML += `
                    <div class="app-card">
                        <img src="${app.icon}" class="app-icon" alt="${app.name}">
                        <div class="app-info">
                            <div class="app-name">${app.name}</div>
                            <div class="app-desc">${app.description}</div>
                            <a href="${app.link}" class="download-btn" target="_blank">تحميل</a>
                        </div>
                    </div>
                `;
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allApps.filter(app => app.name.toLowerCase().includes(term) || app.description.toLowerCase().includes(term));
            displayApps(filtered);
        });

        loadApps();
    </script>
</body>
</html>
