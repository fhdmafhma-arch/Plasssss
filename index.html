<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بلس المتطور - البوابة الرئيسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }
        body {
            background-color: #070b10;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            background-image: radial-gradient(circle at center, rgba(0,255,204,0.05) 0%, rgba(7,11,16,1) 80%);
        }
        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        /* الشعار أو الأيقونة الدائرية */
        .profile-avatar {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #121c26, #1a2938);
            border: 2px solid rgba(0,255,204,0.3);
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            color: #00ffcc;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        /* الاسم والتوثيق */
        .profile-name {
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 8px;
            color: #fff;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: rgba(0, 255, 204, 0.1);
            color: #00ffcc;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 35px;
            border: 1px solid rgba(0, 255, 204, 0.2);
        }
        .badge i {
            font-size: 13px;
        }
        /* الأزرار الفخمة */
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            margin-bottom: 35px;
        }
        .link-btn {
            background-color: #111822;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #fff;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .link-btn:active {
            transform: scale(0.97);
            background-color: #16222f;
            border-color: #00ffcc;
        }
        .link-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .link-content i {
            font-size: 20px;
            color: #00ffcc;
            background: rgba(0, 255, 204, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .link-title {
            font-size: 15px;
            font-weight: 700;
            text-align: right;
        }
        .link-arrow {
            color: #7c8eab;
            font-size: 14px;
        }
        /* أيقونات التواصل الاجتماعي تحت */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .social-icon {
            width: 45px;
            height: 45px;
            background-color: #111822;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
            text-decoration: none;
            transition: 0.2s;
        }
        .social-icon:hover {
            border-color: #00ffcc;
            color: #00ffcc;
        }
        /* الحقوق بالأسفل */
        footer {
            font-size: 11px;
            color: #596982;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- شعار أو أيقونة الواجهة -->
        <div class="profile-avatar">
            <i class="fa-solid fa-bolt"></i>
        </div>

        <!-- اسم المتجر والتوثيق -->
        <h1 class="profile-name">بلس المتطور</h1>
        <div class="badge">
            <i class="fa-solid fa-circle-check"></i>
            موثق رسمياً لتقديم الخدمات والاشتراكات
        </div>

        <!-- الأزرار الرئيسية -->
        <div class="links-list">
            <!-- زر الطلب (يوديك لمتجرك أو صفحة التطبيقات) -->
            <a href="https://pluusss.netlify.app" class="link-btn">
                <div class="link-content">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span class="link-title">اضغط هنا للطلب</span>
                </div>
                <i class="fa-solid fa-chevron-left link-arrow"></i>
            </a>

            <!-- زر الدعم الفني (يفتح الواتساب مباشرة) -->
            <a href="https://wa.me/966000000000" class="link-btn" target="_blank">
                <div class="link-content">
                    <i class="fa-brands fa-whatsapp" style="color: #25d366; background: rgba(37, 211, 102, 0.1);"></i>
                    <span class="link-title">اضغط هنا للدعم الفني</span>
                </div>
                <i class="fa-solid fa-chevron-left link-arrow"></i>
            </a>
        </div>

        <!-- أيقونات التواصل الاجتماعي -->
        <div class="social-icons">
            <a href="https://wa.me/966000000000" class="social-icon" target="_blank"><i class="fa-brands fa-whatsapp"></i></a>
            <a href="#" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
            <a href="#" class="social-icon"><i class="fa-brands fa-telegram"></i></a>
        </div>
    </div>

    <footer>
        جميع الحقوق محفوظة © 2026
    </footer>

</body>
</html>
