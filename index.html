<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ألترا بلس | ULTRA PLUS</title>
    <!-- استيراد الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* أيقونة الشعار العلوي */
        .logo-icon {
            width: 90px;
            height: 90px;
            background: radial-gradient(circle, #1a233a 0%, #0b0f19 80%);
            border: 2px solid #00f2fe;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
        }

        .logo-icon i {
            color: #00f2fe;
            font-size: 40px;
        }

        /* اسم المتجر */
        .store-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }

        /* شارة موثق رسمياً */
        .verified-badge {
            display: flex;
            align-items: center;
            background-color: #0f2624;
            border: 1px solid #10b981;
            color: #10b981;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 14px;
            margin-bottom: 30px;
            gap: 8px;
        }

        /* الأزرار الأساسية */
        .btn-card {
            width: 100%;
            background-color: #131c2e;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 18px 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #ffffff;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn-card:hover {
            border-color: #00f2fe;
        }

        .btn-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-icon {
            background-color: #0d2822;
            color: #10b981;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .btn-text {
            font-size: 16px;
            font-weight: 500;
        }

        .arrow-icon {
            color: #64748b;
            font-size: 14px;
        }

        /* أيقونات التواصل الاجتماعي */
        .social-icons {
            display: flex;
            gap: 15px;
            margin: 20px 0;
        }

        .social-btn {
            width: 45px;
            height: 45px;
            background-color: #131c2e;
            border: 1px solid #1e293b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            text-decoration: none;
            font-size: 18px;
            transition: 0.3s;
        }

        .social-btn:hover {
            border-color: #00f2fe;
            color: #00f2fe;
        }

        /* التذييل (Footer) */
        .footer {
            text-align: center;
            width: 100%;
            margin-top: 20px;
        }

        .powered-by {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #131c2e;
            border: 1px solid #1e293b;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 15px;
        }

        .powered-by i {
            color: #00f2fe;
        }

        .copyrights {
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الأيقونة العلوية -->
        <div class="logo-icon">
            <i class="fa-solid fa-bolt"></i>
        </div>

        <!-- اسم المتجر -->
        <div class="store-title">ألترا بلس | ULTRA PLUS</div>

        <!-- شارة التوثيق -->
        <div class="verified-badge">
            <i class="fa-solid fa-circle-check"></i>
            <span>موثق رسمياً لتقديم الخدمات والاشتراكات</span>
        </div>

        <!-- زر الطلب -->
        <a href="#" class="btn-card">
            <div class="btn-content">
                <div class="btn-icon">
                    <i class="fa-solid fa-bag-shopping"></i>
                </div>
                <span class="btn-text">اضغط هنا للطلب</span>
            </div>
            <i class="fa-solid fa-chevron-left arrow-icon"></i>
        </a>

        <!-- زر الدعم الفني -->
        <a href="#" class="btn-card">
            <div class="btn-content">
                <div class="btn-icon" style="color: #25d366; background-color: #0d2218;">
                    <i class="fa-brands fa-whatsapp"></i>
                </div>
                <span class="btn-text">اضغط هنا للدعم الفني</span>
            </div>
            <i class="fa-solid fa-chevron-left arrow-icon"></i>
        </a>

        <!-- وسائل التواصل الاجتماعي -->
        <div class="social-icons">
            <a href="#" class="social-btn"><i class="fa-brands fa-telegram"></i></a>
            <a href="#" class="social-btn"><i class="fa-brands fa-instagram"></i></a>
            <a href="#" class="social-btn"><i class="fa-brands fa-whatsapp"></i></a>
        </div>
    </div>

    <!-- حقوق النشر والتطوير -->
    <div class="footer">
        <div class="powered-by">
            <i class="fa-solid fa-sparkles"></i>
            <span>Powered by Netlify</span>
        </div>
        <div class="copyrights">جميع الحقوق محفوظة © 2026</div>
    </div>

</body>
</html>
